# ============================================================
# RandomChunk
# Author: KingBrezz
# Paper 26.2 / Java 25
# ============================================================

# Language used by the plugin messages.
# Supported: en, id, vi, th, ru, de
language: en

settings:

  # Enable RandomChunk automatically when the server starts.
  enabled-on-start: false

  # Process each chunk only once.
  # Use /randomchunk reset to process chunks again.
  process-once: true

  # Keep air blocks unchanged.
  replace-air: false

  # Replace bedrock.
  replace-bedrock: true

  # Apply block physics when replacing blocks.
  # false is recommended for better performance.
  apply-physics: false

  # Maximum number of chunks processed at the same time.
  max-active-chunks: 1


# ============================================================
# SPEED
# ============================================================
#
# Available presets:
#
# FAST
# NORMAL
# SLOW
# CUSTOM
#
# NORMAL is the default recommended setting.
#
# FAST:
# 16384 blocks per tick
#
# NORMAL:
# 4096 blocks per tick
#
# SLOW:
# 512 blocks per tick
#
# CUSTOM:
# Uses the value from blocks-per-tick.
#

speed:

  # Available: FAST, NORMAL, SLOW, CUSTOM
  preset: NORMAL

  # Used only when preset is CUSTOM.
  blocks-per-tick: 4096

  # Automatically reduce processing speed when TPS is low.
  adaptive-tps: true

  # Adaptive mode activates below this TPS.
  minimum-tps: 18.0

  # Processing speed used while TPS is low.
  slow-mode-blocks-per-tick: 512


# ============================================================
# WORLDS
# ============================================================

worlds:

  # Empty list = all worlds.
  #
  # Example:
  #
  # enabled:
  #   - world
  #   - world_nether
  #
  enabled: []


# ============================================================
# STORAGE
# ============================================================

storage:

  # Save processed chunks so they remain processed after restart.
  persistent: true

  # Save processed chunk data every X completed chunks.
  # 1 = safest option.
  save-every-chunks: 1
