name: Build RandomChunk

on:
  push:
    branches:
      - main
      - master

  pull_request:

  workflow_dispatch:

jobs:
  build:
    name: Build JAR
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: gradle

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build
        run: |
          chmod +x gradlew
          ./gradlew clean build --no-daemon

      - name: List build files
        run: |
          echo "=== Build output ==="
          find build/libs -maxdepth 1 -type f -print

      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: RandomChunk-JAR
          path: build/libs/*.jar
          if-no-files-found: error
