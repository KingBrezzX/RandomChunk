name: Build RandomChunk

on:
  push:
    branches:
      - main
      - master
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build JAR
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: gradle

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.1.0'

      - name: Build RandomChunk
        run: gradle clean build --no-daemon --stacktrace

      - name: Verify JAR
        shell: bash
        run: |
          set -e

          echo "=== Build output ==="
          ls -lah build/libs/

          JAR="$(find build/libs -maxdepth 1 -type f -name '*.jar' | head -n 1)"

          if [ -z "$JAR" ]; then
            echo "ERROR: RandomChunk JAR was not generated."
            exit 1
          fi

          echo "JAR generated successfully:"
          echo "$JAR"

      - name: Upload RandomChunk JAR
        uses: actions/upload-artifact@v4
        with:
          name: RandomChunk-JAR
          path: build/libs/*.jar
          if-no-files-found: error
