name: Build RandomChunk

on:
  push:
    branches:
      - main
      - master
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build JAR
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.1.0'

      - name: Show environment
        run: |
          java -version
          gradle --version

      - name: Validate project
        run: |
          gradle help --no-daemon --stacktrace

      - name: Clean
        run: |
          gradle clean --no-daemon --stacktrace

      - name: Build
        run: |
          gradle build --no-daemon --stacktrace --info

      - name: Verify JAR
        run: |
          set -e

          JAR="$(find build/libs \
            -maxdepth 1 \
            -type f \
            -name '*.jar' \
            | head -n 1)"

          if [ -z "$JAR" ]; then
            echo "ERROR: JAR tidak ditemukan."
            exit 1
          fi

          echo "SUCCESS: $JAR"
          ls -lh "$JAR"

      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: RandomChunk-JAR
          path: build/libs/*.jar
          if-no-files-found: error
